<svg width="800" height="650" viewBox="0 0 800 650" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14">
    <style>
        .component { fill: #E3F2FD; stroke: #0D47A1; stroke-width: 2; rx: 8; }
        .user-interface { fill: #C8E6C9; stroke: #2E7D32; stroke-width: 2; rx: 8; }
        .database { fill: #FFF9C4; stroke: #FBC02D; stroke-width: 2; rx: 8; }
        .ai-engine { fill: #F3E5F5; stroke: #7B1FA2; stroke-width: 2; rx: 8; }
        .dashboard { fill: #FFCCBC; stroke: #D84315; stroke-width: 2; rx: 8; }
        .genie-framework { fill: #D1C4E9; stroke: #512DA8; stroke-width: 2.5; rx: 8; }
        .knowledge-base { fill: #B2EBF2; stroke: #00838F; stroke-width: 2; rx: 8; }
        .arrow { stroke: #424242; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
        .data-flow-label { fill: #37474F; font-size: 11px; text-anchor: middle; }
        .component-title { font-weight: bold; text-anchor: middle; fill: #0B3C84; }
        .component-desc { font-size: 11px; text-anchor: middle; fill: #1976D2; }
    </style>

    <defs>
        <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#424242" />
        </marker>
    </defs>

    <!-- Title -->
    <text x="400" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#0D47A1">HealthyGambia AI - High-Level Architecture</text>

    <!-- Components -->
    <!-- User Interfaces -->
    <g id="user-interfaces">
        <rect x="50" y="80" width="150" height="150" class="user-interface"/>
        <text x="125" y="105" class="component-title">User Devices</text>
        <text x="125" y="135" class="component-desc">SMS</text>
        <text x="125" y="165" class="component-desc">WhatsApp</text>
        <text x="125" y="195" class="component-desc">Web App</text>
    </g>
    
    <!-- GENIE.AI Framework -->
    <g id="genie-framework">
        <rect x="300" y="150" width="200" height="300" class="genie-framework"/>
        <text x="400" y="175" class="component-title" fill="#311B92">GENIE.AI Framework</text>
        <text x="400" y="190" class="component-desc" fill="#4527A0">(Backend & AI Orchestration)</text>
        <line x1="310" y1="205" x2="490" y2="205" stroke="#7E57C2"/>
        <text x="400" y="230" class="component-desc" fill="#4527A0">Chatbot Interface</text>
        <text x="400" y="260" class="component-desc" fill="#4527A0">Personalization Engine</text>
        <text x="400" y="290" class="component-desc" fill="#4527A0">AI Engine</text>
        <text x="400" y="320" class="component-desc" fill="#4527A0">Analytics Module</text>
    </g>

    <!-- Knowledge Base -->
    <g id="knowledge-base">
        <rect x="300" y="500" width="200" height="110" class="knowledge-base"/>
        <text x="400" y="525" class="component-title" fill="#006064">Knowledge Base</text>
        <text x="400" y="550" class="component-desc" fill="#00838F">WHO NCD Guidelines</text>
        <text x="400" y="575" class="component-desc" fill="#00838F">Gambia MoH Protocols</text>
        <text x="400" y="600" class="component-desc" fill="#00838F">User Profile Data</text>
    </g>

    <!-- Database & Analytics -->
    <g id="db-analytics">
        <rect x="575" y="225" width="175" height="150" class="database"/>
        <text x="662.5" y="250" class="component-title">Database</text>
        <text x="662.5" y="270" class="component-desc">(PostgreSQL)</text>
        <text x="662.5" y="300" class="component-desc">User Profiles</text>
        <text x="662.5" y="325" class="component-desc">Interaction Logs</text>
        
        <rect x="575" y="400" width="175" height="100" class="dashboard"/>
        <text x="662.5" y="425" class="component-title">Analytics Dashboard</text>
        <text x="662.5" y="450" class="component-desc">Track Usage & Impact</text>
    </g>

    <!-- Data Flows -->
    <!-- User to GENIE -->
    <path class="arrow" d="M 200 155 C 250 155, 250 240, 300 240"/>
    <text x="250" y="195" class="data-flow-label">1. Request</text>

    <!-- GENIE to User -->
    <path class="arrow" d="M 300 300 C 250 300, 250 200, 200 200"/>
    <text x="250" y="255" class="data-flow-label">5. Response</text>
    
    <!-- GENIE to Knowledge Base -->
    <path class="arrow" d="M 400 450 V 500"/>
    <text x="400" y="480" class="data-flow-label">2. Query for context</text>

    <!-- GENIE to DB -->
    <path class="arrow" d="M 500 280 C 530 280, 540 290, 575 290"/>
    <text x="535" y="275" class="data-flow-label">3. Get/Update User</text>
    <path class="arrow" d="M 500 320 C 530 320, 540 320, 575 320"/>
    <text x="535" y="340" class="data-flow-label">4. Log Interaction</text>

    <!-- DB to Analytics -->
    <path class="arrow" d="M 662.5 375 V 400"/>
    <text x="662.5" y="392" class="data-flow-label">Metrics</text>

</svg>